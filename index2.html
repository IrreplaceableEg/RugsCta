=========================== */
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');

/* ===========================
   RESET
=========================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    /* font-family:'Inter',sans-serif; */
        font-family: "Playfair Display, serif" !important;
    
    color:#222;
    overflow-x:hidden;
}

/* ===========================
   CTA SECTION
=========================== */

.cta{
    /* min-height:100vh; */
    /* min-height: 50vh; */
    display:flex;
    align-items:center;
    background:#f8f5f0;
    /* padding:80px 8%; */
     padding-top: 1rem;
}

.container{
    width:100%;
    max-width:1200px;
    margin:auto;

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;
    align-items:center;
}

/* ===========================
LEFT
=========================== */

.tag{

display:inline-flex;
align-items:center;
gap:12px;

background:#9b6234;
color:white;

padding:12px 22px;

border-radius:50px;

font-size:.9rem;
font-weight:600;

margin-bottom:25px;

letter-spacing:.5px;

}

.content h1{

/* font-family:'Playfair Display',serif; */
    font-family: "Playfair Display, serif" !important;

font-size:clamp(3rem,6vw,4rem);

line-height:1.08;

margin-bottom:25px;

font-weight:700;

}

.content h1 span{

color:#e50e89;

}

.line{

width:90px;
height:2px;
background:#D4AF37;
margin:25px 0;

}

.content p{

max-width:500px;

font-size:1.3rem;

line-height:1.9;

color:#666;

margin-bottom:40px;

}

/* ===========================
BUTTONS
=========================== */

.buttons{

display:flex;
gap:18px;
flex-wrap:wrap;

}

.btn{

display:inline-flex;
align-items:center;
justify-content:center;

padding:10px 15px;

border-radius:12px;

font-weight:600;

text-decoration:none;

transition:.35s;
font-size: 1rem;

cursor:pointer;

}

.primary{

background:#9b6234;
color:#fff;

box-shadow:0 18px 30px rgba(155,98,52,.25);

}

.primary:hover{

transform:translateY(-4px);

box-shadow:0 22px 40px rgba(155,98,52,.35);

}

.secondary{

background:white;

color:#D4AF37;

border:2px solid #D4AF37;

}

.secondary:hover{

background:#D4AF37;

color:white;

}

FEATURES

/* ===========================
RIGHT
=========================== */

.gallery{

position:relative;

/* height:650px; */
/* height: 500px; */

display:flex;

align-items:flex-end;

justify-content:center;

gap:26px;

}

/* ===========================
CARD
=========================== */

.card{

position:relative;

width:180px;

border-radius:18px;

overflow:hidden;

background:white;

box-shadow:

0 15px 45px rgba(0,0,0,.12);

transition:.45s;

will-change:transform;

}

.card:hover{

transform:translateY(-12px) scale(1.03);

box-shadow:

0 30px 60px rgba(0,0,0,.18);

}

.card img{

width:100%;

height:100%;

display:block;

object-fit:cover;

}

/* Heights */

.card1{

height:200px;

}

.card2{

/* height:420px; */
height: 300px;

}

.card3{

/* height:560px; */
height: 400px;

}

/* ===========================
PEDESTAL
=========================== */

.card::after{

content:"";

position:absolute;

left:0;

right:0;

bottom:-90px;

height:90px;

background:#ece2d4;

border-radius:0 0 12px 12px;

box-shadow:

0 10px 20px rgba(0,0,0,.08) inset;

}

/* ===========================
IMAGE SHADOW
=========================== */

.card::before{

content:"";

position:absolute;

left:10%;

bottom:-25px;

width:80%;

height:18px;

background:rgba(0,0,0,.18);

filter:blur(14px);

z-index:-1;

}

/* ===========================
FLOATING
=========================== */

.card:nth-child(1){

animation:float1 5s ease-in-out infinite;

}

.card:nth-child(2){

animation:float2 6s ease-in-out infinite;

}

.card:nth-child(3){

animation:float3 7s ease-in-out infinite;

}

@keyframes float1{

50%{

transform:translateY(-12px);

}

}

@keyframes float2{

50%{

transform:translateY(-18px);

}

}

@keyframes float3{

50%{

transform:translateY(-15px);

}

}

/* ===========================
RESPONSIVE
=========================== */

@media(max-width:1100px){

.container{

grid-template-columns:1fr;

text-align:center;

}

.content p{

margin:auto auto 40px;

}

.buttons{

justify-content:center;

}

.features{

justify-content:center;

}

.gallery{

margin-top:60px;

height:520px;

}

}

@media(max-width:768px){

.gallery{

gap:12px;

height:350px;

}

.card{

width:30%;

}

.card1{

height:170px;

}

.card2{

height:230px;

}

.card3{

height:290px;

}

.features{

gap:25px;

}

}

@media(max-width:480px){

.content h1{

font-size:2.5rem;

}

.buttons{

flex-direction:column;

}

.btn{

width:100%;

}

.features{

flex-direction:column;

align-items:center;

}

.gallery{

height:260px;

}

.card1{

height:130px;

}

.card2{

height:170px;

}

.card3{

height:220px;

}

}
